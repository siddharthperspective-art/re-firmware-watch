name: Tripper Dash firmware watch

on:
  schedule:
    - cron: "7 4 * * *"   # daily 04:07 UTC = 09:37 IST (off the hour; top-of-hour runs get delayed)
  workflow_dispatch:       # "Run workflow" button for manual checks
    inputs:
      test:
        description: "Only send a test notification to the phone"
        type: boolean
        default: false

permissions:
  contents: write          # to commit state.json back

concurrency:
  group: firmware-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Check sources and notify
        env:
          WATCH_CHANNELS: ntfy
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::error::Repository secret NTFY_TOPIC is not set"
            exit 1
          fi
          if [ "${{ inputs.test }}" = "true" ]; then
            python3 watch.py --test
          else
            python3 watch.py
          fi

      - name: Save state
        if: ${{ !inputs.test }}
        run: |
          if git diff --quiet -- state.json; then
            echo "State unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update watch state"
          git push
